# Continuous integration.
# NOTE: not yet run — the repository is not on GitHub yet. Treat the first
# run as the real verification (docs/known-limitations.md says so too).
#
#   core     core library + editor logic + tests, all three desktop OSes (fast)
#   runtime  full build with the Axmol window/runtime on all three OSes.
#            Linux runs every test, window tests on a virtual display (they
#            include exporting a game and starting the exported program);
#            macOS runs every test; Windows runs all but the window tests
#            until they are known to work on Windows CI machines.
#   web      the web runtime (WebAssembly, built with Emscripten), then the
#            real thing end to end: the editor exports a game for the web
#            and a headless browser plays it (tools/web/check_web_game.js).
name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # "-- -k 0" tells Ninja to keep going after an error, so one run
      # reports every file that fails to compile, not just the first.
      - name: Configure, build and test
        run: |
          cmake --preset core
          cmake --build --preset core -- -k 0
          ctest --preset core

  runtime:
    name: runtime / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded Axmol
        uses: actions/cache@v4
        with:
          path: external
          key: external-${{ runner.os }}-${{ hashFiles('cmake/RoloAxmol.cmake', 'cmake/axmol-patches/**') }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja   # pwsh is preinstalled on GitHub runners

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev \
            libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri libfontconfig1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libwayland-dev libxkbcommon-dev

      - name: Configure and build
        run: |
          cmake --preset dev
          cmake --build --preset dev -- -k 0

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: ctest --preset dev

      # An exported game is changed after the build, so the editor signs it
      # again; without a valid signature other Macs call it "damaged".
      - name: Check the exported game's signature (macOS)
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "build/dev/tests/test-exports/The Lantern Keeper.app"

      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --preset dev

      # GitHub's Windows machines have no screen that can run OpenGL 3, so
      # the tests that open a window (labelled "window") are skipped there.
      - name: Test (Windows, without window tests)
        if: runner.os == 'Windows'
        run: ctest --preset dev -LE window

  web:
    name: web / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded Axmol
        uses: actions/cache@v4
        with:
          path: external
          key: external-${{ runner.os }}-${{ hashFiles('cmake/RoloAxmol.cmake', 'cmake/axmol-patches/**') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev \
            libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri libfontconfig1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libwayland-dev libxkbcommon-dev

      # The version Rolo's web runtime is built and tested with (docs/building.md).
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.9

      - name: Build the web runtime
        run: |
          emcmake cmake --preset web
          cmake --build --preset web

      # The editor exports the game (it finds the web runtime just built).
      - name: Build the editor
        run: |
          cmake --preset dev
          cmake --build --preset dev --target rolo_editor

      - name: Export a game for the web
        run: |
          xvfb-run -a build/dev/bin/rolo_editor/rolo_editor --project templates/platformer/project --export-web web-export
          xvfb-run -a build/dev/bin/rolo_editor/rolo_editor --project templates/topdown/project --export-web web-export
          xvfb-run -a build/dev/bin/rolo_editor/rolo_editor --project tests/data/jpeg_project --export-web web-export
          ls -la "web-export/Platformer Starter Web"

      - name: Play the exported games in a browser
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node tools/web/check_web_game.js "web-export/Platformer Starter Web" --screenshot platformer.png \
            --keys ArrowRight,Space,Escape,ArrowDown,Enter,Escape
          node tools/web/check_web_game.js "web-export/Top-Down Starter Web" --screenshot topdown.png \
            --keys ArrowRight,F5 --expect "Saved to slot 'quick'"
          # JPEG images, which Rolo decodes itself (ADR 0023).
          node tools/web/check_web_game.js "web-export/JPEG Test Web" --screenshot jpeg.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-check
          path: |
            *.png
            web-export

