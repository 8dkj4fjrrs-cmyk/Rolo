# Android (experimental): builds Rolo's Android runtime, has the editor export
# a game for Android with it (the Platformer Starter), and plays the exported
# app in an Android emulator. ADR 0028, steps 1 and 2. Separate from CI
# (ci.yml) on purpose: Android cannot be built where Rolo is developed, so
# this workflow is where it is built and tried at all, and an emulator on a
# build machine is slower and less steady than the other tests. A failure
# here does not make CI fail.
#
# It runs when something Android-specific changes, on any branch whose name
# starts with "android", and by hand (Actions > Android > Run workflow).
#
#   1. Gradle builds Rolo's Android runtime from the sources: the player for
#      phones (arm64-v8a) and for the emulator (x86_64), optimised, in a
#      Gradle project of its own (what Rolo's download carries).
#   2. The editor is built, makes an upload key, and exports the game for
#      Android from the command line, as a maker's computer would: Java runs
#      Gradle's starter, which fetches Gradle and Google's build plugin and
#      builds the .apk and the signed .aab. Only the Android SDK and Java
#      are used: no NDK, no CMake.
#   3. The results are checked: the app's name, package and version, its
#      libraries' 16 KB pages (Google Play asks for it), the .aab's signature;
#      and a wrong password must be refused in plain words.
#   4. An emulator starts the app; tools/android/check_android_game.py waits
#      for the first scene, takes screenshots, touches the on-screen
#      controls, presses Back, sends the app to the background and brings it
#      back, and quits the game from its pause menu. A second start checks
#      that the game is not unpacked again.
#
# The export (.apk, .aab), the screenshots and Android's log are kept as
# "android-check" (on the run's page, under Artifacts).
name: Android (experimental)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'android**'
    paths:
      - '.github/workflows/android.yml'
      - 'player/android/**'
      - 'tools/android/**'
      - 'tools/pack/**'
      - 'player/CMakeLists.txt'
      - 'editor/model/AndroidExport.*'
      - 'editor/model/Process.*'
      - 'editor/application/Exporting.*'
      - 'editor/application/main.cpp'
      - 'player/runtime/main.cpp'
      - 'engine/runtime/src/Android.cpp'
      - 'engine/runtime/src/Application.cpp'
      - 'engine/runtime/include/rolo/runtime/Android.hpp'
      - 'cmake/RoloAxmol.cmake'
      - 'cmake/axmol-patches/**'

jobs:
  android:
    name: build and play / emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded Axmol
        uses: actions/cache@v4
        with:
          path: external
          key: external-${{ runner.os }}-${{ hashFiles('cmake/RoloAxmol.cmake', 'cmake/axmol-patches/**') }}

      - name: Install what the editor's build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev \
            libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri libfontconfig1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libwayland-dev libxkbcommon-dev

      # Gradle (Android's build tool) runs on Java. The Android SDK and NDK
      # are on GitHub's machines already; Gradle fetches what is missing.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Gradle version of player/android/gradle/wrapper/gradle-wrapper.properties,
      # for building the runtime from the sources. (This action also checks
      # that gradle-wrapper.jar in the repository is Gradle's own, unchanged.)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build Rolo's Android runtime
        working-directory: player/android
        run: |
          gradle :app:roloAndroidRuntime --stacktrace
          find app/build/android-runtime -maxdepth 4 | sort | head -60
          du -sh app/build/android-runtime app/build/android-runtime/app/src/main/jniLibs/*

      - name: Build the editor
        run: |
          cmake --preset dev
          cmake --build --preset dev --target rolo_editor

      # As a maker would, but from the command line. The password travels
      # in an environment variable, never as an argument.
      - name: Make an upload key and export the game for Android
        env:
          ROLO_ANDROID_KEYSTORE_PASSWORD: a-test-password
        run: |
          build/dev/bin/rolo_editor/rolo_editor --new-android-key "$RUNNER_TEMP/upload.jks" --android-key-owner "Rolo's Test, Ltd"
          build/dev/bin/rolo_editor/rolo_editor --project templates/platformer/project \
            --export-android android-export --android-package dev.roloengine.platformer \
            --android-version-code 7 --android-version-name 1.2 --android-key "$RUNNER_TEMP/upload.jks"
          ls -la "android-export/Platformer Starter Android"
          cat "android-export/Platformer Starter Android/README.txt"
          cp "android-export/Platformer Starter Android/Platformer Starter.apk" rolo-exported-game.apk
          cp "android-export/Platformer Starter Android/Platformer Starter.aab" rolo-exported-game.aab
          # The next version, to see below that a phone takes it as an update.
          build/dev/bin/rolo_editor/rolo_editor --project templates/platformer/project \
            --export-android android-export-update --android-package dev.roloengine.platformer \
            --android-version-code 8 --android-version-name 1.3 --android-key "$RUNNER_TEMP/upload.jks"
          cp "android-export-update/Platformer Starter Android/Platformer Starter.apk" rolo-exported-game-update.apk
          # And without a key: the app "to try", signed with the debug key
          # (a newer version still, so that only its key can be what stops
          # it from replacing the others below).
          build/dev/bin/rolo_editor/rolo_editor --project templates/platformer/project \
            --export-android android-export-try --android-package dev.roloengine.platformer \
            --android-version-code 9 --android-version-name 1.4
          test ! -e "android-export-try/Platformer Starter Android/Platformer Starter.aab"
          cp "android-export-try/Platformer Starter Android/Platformer Starter.apk" rolo-game-to-try.apk

      # What is inside, and: every part of each library that is loaded into
      # memory must be laid out for 16 KB pages (0x4000), or new phones
      # refuse it and Google Play rejects the app.
      - name: Check the exported app and the file for Google Play
        env:
          ROLO_ANDROID_KEYSTORE_PASSWORD: a-test-password
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          # The app to share is signed with the maker's key (the same
          # certificate as in the key file), and is not a debug build; the
          # app to try is a debug build signed with another key.
          "$BUILD_TOOLS/apksigner" verify --print-certs rolo-exported-game.apk | tee apk-signer.txt
          grep -q "Rolo's Test" apk-signer.txt
          KEY_PRINT="$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass:env ROLO_ANDROID_KEYSTORE_PASSWORD | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')"
          APK_PRINT="$(grep 'certificate SHA-256 digest' apk-signer.txt | head -1 | sed 's/.*digest: *//')"
          echo "Key file: $KEY_PRINT"; echo "App:      $APK_PRINT"
          test -n "$KEY_PRINT" && test "$KEY_PRINT" = "$APK_PRINT"
          if "$BUILD_TOOLS/aapt2" dump badging rolo-exported-game.apk | grep -q "application-debuggable"; then echo "::error::The app to share is debuggable"; exit 1; fi
          "$BUILD_TOOLS/aapt2" dump badging rolo-game-to-try.apk | grep -q "application-debuggable"
          "$BUILD_TOOLS/apksigner" verify --print-certs rolo-game-to-try.apk | grep "certificate DN" | tee try-signer.txt
          if grep -q "Rolo's Test" try-signer.txt; then echo "::error::The app to try is signed with the maker's key"; exit 1; fi
          "$BUILD_TOOLS/aapt2" dump badging rolo-exported-game-update.apk | grep -q "versionCode='8'"
          "$BUILD_TOOLS/aapt2" dump badging rolo-exported-game.apk | grep -E "^package|application-label:|sdkVersion|native-code" | tee badging.txt
          grep -q "name='dev.roloengine.platformer'" badging.txt
          grep -q "versionCode='7'" badging.txt
          grep -q "versionName='1.2'" badging.txt
          grep -q "application-label:'Platformer Starter'" badging.txt
          unzip -l rolo-exported-game.apk | grep -E "lib/|assets/game.pack|classes"
          echo "Shaders: $(unzip -l rolo-exported-game.apk | grep -c assets/axslc/), license texts: $(unzip -l rolo-exported-game.apk | grep -c assets/licenses/)"
          mkdir apk && unzip -q rolo-exported-game.apk -d apk
          test -f apk/assets/game.pack
          test -f apk/assets/licenses/rolo.txt
          for abi in arm64-v8a x86_64; do
            lib="apk/lib/$abi/librolo_player.so"
            test -f "$lib"
            echo "$abi:"
            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW "$lib" | grep LOAD | tee load.txt
            # The last number of each line is the layout's page size.
            python3 -c "import sys; sizes = [int(line.split()[-1], 16) for line in open('load.txt')]; sys.exit(0 if sizes and min(sizes) >= 16384 else 1)" \
              || { echo "::error::$lib is not laid out for 16 KB pages"; exit 1; }
          done
          # The bundle: signed with the key made above, and holding the same things.
          jarsigner -verify -verbose -certs rolo-exported-game.aab > signature.txt || { cat signature.txt; exit 1; }
          grep -E "jar verified|CN=" signature.txt | sort -u | head -5
          grep -q "jar verified" signature.txt
          grep -q "Rolo's Test" signature.txt
          unzip -l rolo-exported-game.aab | grep -E "base/lib/|base/assets/game.pack|base/manifest"

      # Google Play does not hand players the .aab: it makes the apps for
      # their phones out of it, with Google's "bundletool". The same tool
      # here: is the bundle well-formed, what does it say of itself, and
      # the app made from it is played in the emulator below.
      - name: Check the bundle with Google's bundletool, as Google Play would read it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.18.3 -R google/bundletool --pattern 'bundletool-all-1.18.3.jar' --output bundletool.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar" | sha256sum --check
          echo "bundletool $(java -jar bundletool.jar version)"
          java -jar bundletool.jar validate --bundle rolo-exported-game.aab | head -40
          java -jar bundletool.jar dump manifest --bundle rolo-exported-game.aab | tee bundle-manifest.xml
          grep -q 'package="dev.roloengine.platformer"' bundle-manifest.xml
          grep -q 'android:versionCode="7"' bundle-manifest.xml
          grep -q 'android:targetSdkVersion="36"' bundle-manifest.xml
          grep -q 'android:allowBackup="true"' bundle-manifest.xml
          if grep -q "uses-permission" bundle-manifest.xml; then echo "::error::The app asks for a permission"; exit 1; fi
          if grep -q 'android:debuggable="true"' bundle-manifest.xml; then echo "::error::The bundle is debuggable"; exit 1; fi
          test -f "android-export/Platformer Starter Android/README.txt"
          # The key's password goes to bundletool in a file, not on the command line.
          printf '%s' "a-test-password" > "$RUNNER_TEMP/key-password.txt"
          java -jar bundletool.jar build-apks --bundle rolo-exported-game.aab --output phones.apks \
            --ks "$RUNNER_TEMP/upload.jks" --ks-key-alias upload --ks-pass "file:$RUNNER_TEMP/key-password.txt"
          echo "Download sizes Google Play would report (bytes, smallest and largest phone):"
          java -jar bundletool.jar get-size total --apks phones.apks
          java -jar bundletool.jar build-apks --bundle rolo-exported-game.aab --output universal.apks --mode universal \
            --ks "$RUNNER_TEMP/upload.jks" --ks-key-alias upload --ks-pass "file:$RUNNER_TEMP/key-password.txt"
          rm "$RUNNER_TEMP/key-password.txt"
          unzip -o -q universal.apks universal.apk
          mv universal.apk rolo-game-from-bundle.apk
          ls -la rolo-game-from-bundle.apk

      # The wrong password must stop the export, and say so in plain words.
      - name: Check that a wrong password is refused clearly
        env:
          ROLO_ANDROID_KEYSTORE_PASSWORD: not-the-password
        run: |
          if build/dev/bin/rolo_editor/rolo_editor --project templates/platformer/project \
               --export-android wrong-password-export --android-package dev.roloengine.platformer \
               --android-key "$RUNNER_TEMP/upload.jks" > wrong-password.txt 2>&1; then
            echo "::error::An export with the wrong key password succeeded"; exit 1
          fi
          tail -5 wrong-password.txt
          grep -q "the password is wrong" wrong-password.txt || { cat wrong-password.txt; exit 1; }

      # Emulators need the machine's virtualisation (KVM), which GitHub's
      # Linux machines allow once this rule is in place.
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A phone with a long screen (2400 x 1080), Android 14, no graphics
      # card (drawn by the processor). The game is played as a player would:
      # run right, jump, Back (opens the pause menu, as Escape does), Back
      # again (closes it), Home and back to the app, then the Pause button,
      # down twice to Quit, and Jump to pick it.
      - name: Play the game in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            python3 tools/android/check_android_game.py rolo-exported-game.apk --package dev.roloengine.platformer --screenshot android-first-scene.png --log android-log-1.txt --expect "Unpacking the game" --expect "Set aside" --expect "Back in front" --expect-ended --play "200,200>330,200;-112,112;back;shot:android-pause-menu.png;back;home;wait:2;return;wait:2;shot:android-after-return.png;50%,-79;200,200>200,60;200,200>200,60;shot:android-quit-chosen.png;-112,112"
            python3 tools/android/check_android_game.py rolo-exported-game.apk --package dev.roloengine.platformer --keep-installed --screenshot android-second-start.png --log android-log-2.txt --reject "Unpacking the game" --expect "Playing the game inside this app"
            adb uninstall dev.roloengine.platformer
            python3 tools/android/check_android_game.py rolo-game-from-bundle.apk --package dev.roloengine.platformer --screenshot android-from-bundle.png --log android-log-3.txt --expect "Unpacking the game" --expect-ended --play "200,200>330,200;-112,112;back;back;50%,-79;200,200>200,60;200,200>200,60;-112,112"
            sh tools/android/check_android_update.sh rolo-exported-game.apk rolo-exported-game-update.apk rolo-game-to-try.apk dev.roloengine.platformer
            sh tools/android/check_android_backup.sh rolo-game-to-try.apk dev.roloengine.platformer

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check
          path: |
            rolo-exported-game.apk
            rolo-exported-game.aab
            android-*.png
            android-log-*.txt
