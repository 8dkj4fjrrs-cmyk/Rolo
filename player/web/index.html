<!doctype html>
<!--
  The page of a Rolo game exported for the web (docs/exporting.md).

  It needs, beside it: rolo_player.js, rolo_player.wasm, rolo_player.data
  (Rolo's game runtime) and game.pack (the game). Put the whole folder on any
  web host; opening this file straight from a disk does not work, because
  browsers do not let pages read files that way.

  You may change this page as you like (colours, text, what is around the
  game). Keep the canvas with id "canvas" and the script at the end.
  {{TITLE}} is replaced by the game's name when the game is exported.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0e0f13;
    color: #e8e8ee;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #stage { position: relative; line-height: 0; }
  /* The game draws at its own size; the page scales the picture to fit (see fit() below). */
  /* touch-action: fingers on the game play it; they do not scroll or zoom the page. */
  /* Its size on the page comes from fit() through --game-width and --game-height. "!important",
     because the game's window code writes sizes onto the canvas itself on sharp (Retina) screens. */
  #canvas { width: var(--game-width, 1280px) !important; height: var(--game-height, 720px) !important;
            display: block; background: #000; outline: none; touch-action: none;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .panel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; box-sizing: border-box; line-height: 1.4;
    text-align: center; background: #0e0f13;
  }
  .panel[hidden] { display: none; }
  .panel h1 { font-size: 22px; font-weight: 600; margin: 0; }
  .panel p { margin: 0; max-width: 34em; color: #b9bac6; }
  #bar { width: min(320px, 70%); height: 6px; border-radius: 3px; background: #2a2c36; overflow: hidden; }
  #bar > div { width: 0; height: 100%; background: #f2a93b; transition: width .15s; }
  button {
    font: inherit; color: #14151a; background: #f2a93b; border: 0; border-radius: 6px;
    padding: 9px 18px; cursor: pointer;
  }
  button:hover { background: #ffbd55; }
  button[hidden] { display: none; }
  #fullscreen {
    position: fixed; right: 12px; bottom: 12px; padding: 6px 10px;
    color: #b9bac6; background: #1b1c23; border: 1px solid #2f313c; font-size: 13px;
  }
  #fullscreen:hover { color: #fff; background: #262833; }
  :fullscreen #fullscreen { display: none; }
  /* Phones and tablets: out of the way of the on-screen buttons at the bottom. */
  @media (pointer: coarse) {
    #fullscreen { top: 8px; right: 8px; bottom: auto; opacity: .75; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" width="1280" height="720" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="loading" class="panel">
    <h1>{{TITLE}}</h1>
    <div id="bar"><div></div></div>
    <p id="status">Loading…</p>
  </div>
  <div id="ended" class="panel" hidden>
    <h1>Thanks for playing</h1>
    <button type="button" onclick="location.reload()">Play again</button>
  </div>
  <div id="failed" class="panel" hidden>
    <h1>The game could not start</h1>
    <p id="reason"></p>
  </div>
</div>
<button id="fullscreen" type="button">Fullscreen</button>
<noscript>This game needs JavaScript.</noscript>

<script>
  var canvas = document.getElementById('canvas');
  var stage = document.getElementById('stage');

  function show(id) {
    ['loading', 'ended', 'failed'].forEach(function (panel) {
      document.getElementById(panel).hidden = panel !== id;
    });
  }

  // The game's own size (its resolution), as the page was made with. The
  // canvas may get more pixels than that on sharp screens; its shape stays.
  var game = { width: canvas.width, height: canvas.height };

  // Scales the game's picture to fit the window, keeping its shape.
  function fit() {
    var scale = Math.min(window.innerWidth / game.width, window.innerHeight / game.height);
    document.documentElement.style.setProperty('--game-width', Math.floor(game.width * scale) + 'px');
    document.documentElement.style.setProperty('--game-height', Math.floor(game.height * scale) + 'px');
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  window.addEventListener('load', fit);
  // Phones change the page's size as their address bar hides and shows.
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  setTimeout(fit, 300);
  fit();

  var fullscreenButton = document.getElementById('fullscreen');
  var goFullscreen = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
  if (!goFullscreen) {
    fullscreenButton.hidden = true;   // iPhones cannot make a page fullscreen
  }
  fullscreenButton.addEventListener('click', function () {
    goFullscreen.call(document.documentElement);
    canvas.focus();
  });

  function failed(message) {
    document.getElementById('reason').textContent = message;
    show('failed');
  }

  if (location.protocol === 'file:') {
    failed('This page was opened straight from a file. Browsers only let games load their files from a web ' +
           'address: put this folder on a web host (itch.io, GitHub Pages...), or see README.txt to try it on ' +
           'your own computer.');
  } else if (typeof WebAssembly !== 'object' || !document.createElement('canvas').getContext('webgl2')) {
    failed('This browser cannot run the game (it needs WebAssembly and WebGL 2). Try a current version of ' +
           'Chrome, Firefox, Edge or Safari.');
  } else {
    var Module = {
      canvas: canvas,
      print: function (text) { console.log(text); },
      printErr: function (text) { console.warn(text); },
      onRoloProgress: function (loaded, total) {
        if (total > 0) document.querySelector('#bar > div').style.width = Math.round(100 * loaded / total) + '%';
      },
      onRoloError: failed,
      onRoloGameEnded: function () { show('ended'); },
      // The game's first frame is about to be drawn.
      onRuntimeInitialized: function () { show(null); canvas.focus(); },
      onAbort: function (what) { failed('The game stopped unexpectedly. (' + what + ')'); }
    };
    window.addEventListener('error', function (event) {
      if (!document.getElementById('loading').hidden) failed(event.message || 'A file could not be loaded.');
    });
    var script = document.createElement('script');
    script.src = 'rolo_player.js';
    script.onerror = function () { failed('rolo_player.js could not be loaded. Is it beside this page?'); };
    document.body.appendChild(script);
  }
</script>
</body>
</html>
