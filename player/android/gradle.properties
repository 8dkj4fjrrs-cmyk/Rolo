# Settings for Gradle itself.

# Memory for the build.
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

# Lets the app be installed with a plain "adb install" (and by the test in
# tools/android): Android Studio otherwise marks what it builds "test only".
android.injected.testOnly=false

# Show what the C++ build prints.
android.native.buildOutput=verbose
