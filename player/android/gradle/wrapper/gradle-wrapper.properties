# The version of Gradle (Android's build tool) this project is built with.
# Android Studio reads it and fetches that version by itself, and so does
# gradle-wrapper.jar beside this file (Gradle's own small starter program,
# which the editor runs with Java when it exports a game).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
